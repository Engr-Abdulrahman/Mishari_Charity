<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>تطبيق الصندوق</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* شاشة البدء */
        .welcome-screen {
            position: fixed; inset: 0;
            background: linear-gradient(145deg, #0a0f1a 0%, #05080f 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 3000;
            animation: fadeInOut 2.8s ease-in-out forwards;
            pointer-events: none;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; visibility: visible; }
            10% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        .welcome-text-wrapper {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0;
            animation: textFadeSlide 0.6s ease-out 0.2s forwards, textFadeOut 0.4s ease-in 2.4s forwards;
            width: 90%; max-width: 800px;
        }
        @keyframes textFadeSlide {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes textFadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }
        .welcome-title {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            font-weight: 800; text-align: center;
            line-height: 1.1; letter-spacing: 0.02em; width: 100%;
        }
        .welcome-title .line1 {
            display: block; font-size: clamp(4rem, 15vw, 12rem);
            background: linear-gradient(135deg, #F5D97A, #2BBF9F);
            background-clip: text; -webkit-background-clip: text;
            color: transparent;
        }
        .welcome-title .line2 {
            display: block; font-size: clamp(3.5rem, 13vw, 10rem);
            background: linear-gradient(135deg, #FFE6B0, #F5D97A);
            background-clip: text; -webkit-background-clip: text;
            color: transparent;
            margin-top: -0.05em;
        }
        @media (max-width: 480px) {
            .welcome-title .line1 { font-size: clamp(3rem, 20vw, 5rem); }
            .welcome-title .line2 { font-size: clamp(2.5rem, 17vw, 4.2rem); }
        }

        /* الجسم */
        body {
            background: #020A0D;
            font-family: 'IBM Plex Sans Arabic', 'Segoe UI', 'Tahoma', sans-serif;
            font-weight: 500;
            padding: 0.8rem;
            color: #BDEADF;
            padding-bottom: 90px;
        }

        .app-container { max-width: 900px; margin: 0 auto; }

        /* شريط التصدير/الاستيراد */
        .io-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            justify-content: center;
        }
        .io-btn {
            flex: 1;
            max-width: 200px;
            padding: 0.55rem 0.8rem;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            border: 2px solid;
        }
        .io-btn.export {
            background: linear-gradient(135deg, #1A8A75, #0F6A5A);
            color: #fff;
            border-color: #2BBF9F;
        }
        .io-btn.export:hover {
            background: linear-gradient(135deg, #2BBF9F, #1A8A75);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(43, 191, 159, 0.25);
        }
        .io-btn.import {
            background: linear-gradient(135deg, #2A1F18, #1A100D);
            color: #C9B89A;
            border-color: #5A4A3A;
        }
        .io-btn.import:hover {
            background: linear-gradient(135deg, #3A2A20, #2A1F18);
            border-color: #A89070;
            color: #E8D4B8;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(168, 144, 112, 0.2);
        }
        .io-btn:active { transform: translateY(0) scale(0.98); }

        /* الهيدر */
        .main-header {
            text-align: center;
            margin-bottom: 1rem;
            border-bottom: 2px solid #1A4A40;
            padding-bottom: 0.6rem;
        }
        .main-header h1 {
            font-size: 1.5rem; font-weight: 700;
            background: linear-gradient(135deg, #C9B89A, #2BBF9F);
            background-clip: text; -webkit-background-clip: text;
            color: transparent;
        }
        .main-header p {
            color: #6A9A8F; font-size: 0.85rem;
            margin-top: 0.2rem;
        }

        /* الرصيد */
        .balance-card {
            background: linear-gradient(135deg, #061216, #0A1A20);
            border: 1px solid #1A4A40;
            border-radius: 12px;
            padding: 0.9rem 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .balance-label {
            font-size: 0.75rem; color: #6A9A8F;
            font-weight: 600; letter-spacing: 0.5px;
        }
        .balance-amount {
            font-size: 1.8rem; font-weight: 800;
            display: block; direction: ltr;
            margin-top: 0.2rem;
        }
        .balance-positive { color: #2BBF9F; }
        .balance-negative { color: #FF7A7A; }
        .balance-sub {
            font-size: 0.7rem; color: #4A8A7A;
            display: block; margin-top: 0.15rem;
        }
        .balance-mini-row {
            display: flex;
            justify-content: space-around;
            margin-top: 0.6rem;
            padding-top: 0.6rem;
            border-top: 1px solid #1A4A40;
            gap: 0.5rem;
        }
        .balance-mini { text-align: center; flex: 1; }
        .balance-mini-label {
            font-size: 0.65rem; color: #6A9A8F;
            display: block; margin-bottom: 0.15rem;
        }
        .balance-mini-amount {
            font-size: 0.95rem; font-weight: 700;
            direction: ltr; display: block;
        }
        .in-color { color: #2BBF9F; }
        .out-color { color: #FF9F7C; }

        /* تبويبات الفلترة */
        .filter-tabs {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1rem;
            background: #061216;
            padding: 0.3rem;
            border-radius: 12px;
            border: 1px solid #1A4A40;
        }
        .filter-tab {
            flex: 1;
            padding: 0.55rem 0.4rem;
            text-align: center;
            background: transparent;
            border: none;
            color: #6A9A8F;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .filter-tab.active {
            background: linear-gradient(135deg, #1A8A75, #0F6A5A);
            color: #fff;
            box-shadow: 0 2px 10px rgba(43, 191, 159, 0.25);
        }
        .filter-tab:hover:not(.active) {
            color: #BDEADF;
            background: #0A1A20;
        }
        .filter-tab .count {
            display: block;
            font-size: 0.65rem;
            opacity: 0.75;
            margin-top: 0.1rem;
        }

        /* قائمة العمليات */
        .transactions-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* الكرت المبسط */
        .tx-card {
            background: #061216;
            border-radius: 10px;
            padding: 0.6rem 0.8rem;
            border: 1px solid #1A4A40;
            border-right: 4px solid #2BBF9F;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transition: all 0.2s ease;
        }
        .tx-card.outgoing { border-right-color: #FF9F7C; }
        .tx-card:hover { background: #081A20; transform: translateX(-2px); }
        .tx-card.outgoing:hover { background: #1A100D; }

        .tx-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            background: rgba(43, 191, 159, 0.12);
            border: 1px solid rgba(43, 191, 159, 0.3);
        }
        .tx-card.outgoing .tx-icon {
            background: rgba(255, 159, 124, 0.12);
            border-color: rgba(255, 159, 124, 0.3);
        }

        .tx-body { flex: 1; min-width: 0; }
        .tx-desc {
            font-size: 0.88rem;
            font-weight: 600;
            color: #BDEADF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tx-date {
            font-size: 0.72rem;
            color: #6A9A8F;
            margin-top: 0.1rem;
            direction: ltr;
            text-align: right;
        }

        .tx-right { text-align: left; flex-shrink: 0; }
        .tx-amount {
            font-size: 0.95rem;
            font-weight: 700;
            direction: ltr;
            color: #2BBF9F;
        }
        .tx-card.outgoing .tx-amount { color: #FF9F7C; }
        .tx-badge {
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.1rem 0.4rem;
            border-radius: 6px;
            display: inline-block;
            margin-top: 0.15rem;
            background: rgba(43, 191, 159, 0.15);
            color: #2BBF9F;
        }
        .tx-card.outgoing .tx-badge {
            background: rgba(255, 159, 124, 0.15);
            color: #FF9F7C;
        }

        .tx-delete {
            background: transparent;
            border: none;
            color: #4A8A7A;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.2rem 0.3rem;
            border-radius: 6px;
            transition: all 0.2s;
            flex-shrink: 0;
            font-family: monospace;
        }
        .tx-delete:hover {
            color: #FF6B6B;
            background: rgba(255, 107, 107, 0.1);
        }

        .no-tx {
            text-align: center;
            padding: 3rem 1rem;
            color: #4A8A7A;
            font-size: 0.9rem;
            background: #061216;
            border-radius: 10px;
            border: 1px dashed #1A4A40;
        }

        /* الزر العائم للإضافة */
        .add-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1A8A75, #0F6A5A);
            color: #fff;
            border: 2px solid #2BBF9F;
            font-size: 2rem;
            font-weight: 300;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(43, 191, 159, 0.35);
            z-index: 500;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .add-btn:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, #2BBF9F, #1A8A75);
        }
        .add-btn:active { transform: scale(0.94); }
        @media (max-width: 480px) {
            .add-btn { width: 55px; height: 55px; font-size: 1.8rem; bottom: 15px; left: 15px; }
        }

        /* النافذة المنبثقة */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.25s ease;
            padding: 1rem;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-container {
            background: #061216;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            border: 1px solid #1A5A4F;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.7);
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            overflow: hidden;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            background: #0A1A20;
            padding: 0.9rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1A5A4F;
            flex-shrink: 0;
        }
        .modal-header h3 {
            color: #C9B89A;
            font-size: 1rem;
            font-weight: 700;
        }
        .close-modal {
            background: none;
            border: none;
            color: #8A9A92;
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
            padding: 0 0.3rem;
        }
        .close-modal:hover { color: #FF9F7C; }

        .modal-body { padding: 1rem; overflow-y: auto; }
        .form-group { margin-bottom: 0.85rem; }
        .form-label {
            display: block;
            font-size: 0.8rem;
            color: #8DCBBF;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 0.65rem 0.85rem;
            font-size: 0.95rem;
            border: 2px solid #1A4A40;
            border-radius: 10px;
            background: #020A0D;
            color: #EAF5F2;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            transition: all 0.2s;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #2BBF9F;
            background: #031216;
        }
        .form-input[type="date"] { direction: ltr; text-align: right; }
        .type-toggle {
            display: flex;
            gap: 0.4rem;
            background: #020A0D;
            padding: 0.3rem;
            border-radius: 10px;
            border: 2px solid #1A4A40;
        }
        .type-btn {
            flex: 1;
            padding: 0.55rem;
            border: none;
            background: transparent;
            color: #6A9A8F;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .type-btn.active-in {
            background: linear-gradient(135deg, #1A8A75, #0F6A5A);
            color: #fff;
        }
        .type-btn.active-out {
            background: linear-gradient(135deg, #8A4A30, #6A3A20);
            color: #fff;
        }
        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1A8A75, #0F6A5A);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            margin-top: 0.5rem;
            transition: all 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(43, 191, 159, 0.3);
        }
        .submit-btn:active { transform: translateY(0); }
        .form-error {
            color: #FF6B6B;
            font-size: 0.8rem;
            margin-top: 0.6rem;
            text-align: center;
            min-height: 1rem;
        }

        /* توست التنبيه */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #0A1A20;
            color: #BDEADF;
            padding: 0.7rem 1.2rem;
            border-radius: 10px;
            border: 1px solid #2BBF9F;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            z-index: 5000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            border-color: #FF6B6B;
            color: #FFB0B0;
        }
    </style>
</head>
<body>

    <!-- شاشة البدء -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-text-wrapper">
            <div class="welcome-title">
                <span class="line1">تطبيق</span>
                <span class="line2">الصندوق</span>
            </div>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div class="app-container" id="appContainer" style="display:none;">

        <!-- شريط التصدير/الاستيراد -->
        <div class="io-bar">
            <button class="io-btn export" id="exportBtn" title="تصدير كل البيانات إلى ملف TXT">
                📤 تصدير
            </button>
            <button class="io-btn import" id="importBtn" title="استيراد البيانات من ملف TXT">
                📥 استيراد
            </button>
        </div>

        <div class="main-header">
            <h1>تطبيق الصندوق</h1>
            <p>أهلا وسهلا</p>
        </div>

        <!-- كارت الرصيد -->
        <div class="balance-card">
            <div class="balance-label">💰 الرصيد الحالي</div>
            <span class="balance-amount balance-positive" id="balanceAmount">0 SAR</span>
            <span class="balance-sub" id="balanceSub">🟢 رصيد موجب</span>
            <div class="balance-mini-row">
                <div class="balance-mini">
                    <span class="balance-mini-label">📥 إجمالي الوارد</span>
                    <span class="balance-mini-amount in-color" id="totalIn">0</span>
                </div>
                <div class="balance-mini">
                    <span class="balance-mini-label">📤 إجمالي الصادر</span>
                    <span class="balance-mini-amount out-color" id="totalOut">0</span>
                </div>
            </div>
        </div>

        <!-- تبويبات الفلترة -->
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">
                الكل
                <span class="count" id="countAll">0</span>
            </button>
            <button class="filter-tab" data-filter="incoming">
                📥 الوارد
                <span class="count" id="countIn">0</span>
            </button>
            <button class="filter-tab" data-filter="outgoing">
                📤 الصادر
                <span class="count" id="countOut">0</span>
            </button>
        </div>

        <!-- قائمة العمليات -->
        <div class="transactions-list" id="transactionsList"></div>
    </div>

    <!-- زر الإضافة العائم -->
    <button class="add-btn" id="addBtn" style="display:none;">+</button>

    <!-- نموذج إضافة عملية -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3>➕ إضافة عملية جديدة</h3>
                <button class="close-modal" id="closeAddModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">نوع العملية</label>
                    <div class="type-toggle">
                        <button type="button" class="type-btn active-in" data-type="incoming" id="typeInBtn">📥 وارد</button>
                        <button type="button" class="type-btn" data-type="outgoing" id="typeOutBtn">📤 صادر</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">التاريخ</label>
                    <input type="date" class="form-input" id="formDate">
                </div>
                <div class="form-group">
                    <label class="form-label">الوصف</label>
                    <input type="text" class="form-input" id="formDesc" placeholder="مثال: تبرع من أحمد" maxlength="100">
                </div>
                <div class="form-group">
                    <label class="form-label">المبلغ (SAR)</label>
                    <input type="number" class="form-input" id="formAmount" placeholder="0" min="0" step="any" inputmode="decimal">
                </div>
                <button class="submit-btn" id="submitBtn">💾 حفظ العملية</button>
                <div class="form-error" id="formError"></div>
            </div>
        </div>
    </div>

    <!-- Input مخفي للاستيراد -->
    <input type="file" id="importFileInput" accept=".txt,text/plain" style="display:none;">

    <!-- توست التنبيه -->
    <div class="toast" id="toast"></div>

    <script>
        // =============================================
        // إدارة البيانات مع LocalStorage
        // =============================================
        const STORAGE_KEY = 'mashari_transactions_v1';

        const defaultTransactions = [
            { id: 1, type: "incoming", date: "2025-01-05", amount: 500, description: "تبرع من أحمد محمد" },
            { id: 2, type: "incoming", date: "2025-01-12", amount: 1000, description: "تبرع من إبراهيم علي" },
            { id: 3, type: "incoming", date: "2025-01-20", amount: 250, description: "تبرع من محمد عبدالله" },

            { id: 101, type: "outgoing", date: "2025-01-15", amount: 200, description: "مساعدات لأسرة محتاجة" },
            { id: 102, type: "outgoing", date: "2025-01-22", amount: 150, description: "دعم طالب جامعي" },
            { id: 103, type: "outgoing", date: "2025-02-05", amount: 300, description: "مساعدات لمرضى" },

        ];

        let transactions = [];
        let currentFilter = 'all';
        let selectedType = 'incoming';

        function loadTransactions() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    transactions = JSON.parse(stored);
                    if (!Array.isArray(transactions)) transactions = [...defaultTransactions];
                } else {
                    transactions = [...defaultTransactions];
                    saveTransactions();
                }
            } catch (e) {
                transactions = [...defaultTransactions];
            }
        }

        function saveTransactions() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
            } catch (e) {
                console.error('فشل الحفظ في LocalStorage', e);
            }
        }

        function generateId() {
            if (transactions.length === 0) return 1;
            return Math.max(...transactions.map(t => t.id || 0)) + 1;
        }

        function formatAmount(amount) {
            return Math.floor(amount).toLocaleString('en') + ' SAR';
        }

        function formatDate(dateString) {
            if (!dateString) return '—';
            return dateString;
        }

        function calculateStats() {
            const totalIn = transactions
                .filter(t => t.type === 'incoming')
                .reduce((sum, t) => sum + Number(t.amount || 0), 0);
            const totalOut = transactions
                .filter(t => t.type === 'outgoing')
                .reduce((sum, t) => sum + Number(t.amount || 0), 0);
            const balance = totalIn - totalOut;
            const countAll = transactions.length;
            const countIn = transactions.filter(t => t.type === 'incoming').length;
            const countOut = transactions.filter(t => t.type === 'outgoing').length;
            return { totalIn, totalOut, balance, countAll, countIn, countOut };
        }

        function renderBalance() {
            const { totalIn, totalOut, balance } = calculateStats();
            const balEl = document.getElementById('balanceAmount');
            const subEl = document.getElementById('balanceSub');

            balEl.textContent = Math.floor(balance).toLocaleString('en') + ' SAR';
            balEl.className = 'balance-amount ' + (balance >= 0 ? 'balance-positive' : 'balance-negative');
            subEl.textContent = balance >= 0 ? '🟢 رصيد موجب' : '🔴 رصيد سالب';

            document.getElementById('totalIn').textContent = Math.floor(totalIn).toLocaleString('en') + ' SAR';
            document.getElementById('totalOut').textContent = Math.floor(totalOut).toLocaleString('en') + ' SAR';
        }

        function renderCounts() {
            const { countAll, countIn, countOut } = calculateStats();
            document.getElementById('countAll').textContent = countAll + ' عملية';
            document.getElementById('countIn').textContent = countIn + ' عملية';
            document.getElementById('countOut').textContent = countOut + ' عملية';
        }

        function renderTransactions() {
            const container = document.getElementById('transactionsList');
            container.innerHTML = '';

            let filtered = [...transactions];
            if (currentFilter === 'incoming') {
                filtered = filtered.filter(t => t.type === 'incoming');
            } else if (currentFilter === 'outgoing') {
                filtered = filtered.filter(t => t.type === 'outgoing');
            }

            filtered.sort((a, b) => {
                const dateA = a.date || '';
                const dateB = b.date || '';
                if (dateA !== dateB) return dateB.localeCompare(dateA);
                return (b.id || 0) - (a.id || 0);
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-tx">لا توجد عمليات مطابقة للفلتر الحالي</div>';
                return;
            }

            filtered.forEach(tx => {
                const isOut = tx.type === 'outgoing';
                const card = document.createElement('div');
                card.className = 'tx-card' + (isOut ? ' outgoing' : '');

                card.innerHTML = `
                    <div class="tx-icon">${isOut ? '📤' : '📥'}</div>
                    <div class="tx-body">
                        <div class="tx-desc">${escapeHtml(tx.description || 'بدون وصف')}</div>
                        <div class="tx-date">${formatDate(tx.date)}</div>
                    </div>
                    <div class="tx-right">
                        <div class="tx-amount">${formatAmount(tx.amount)}</div>
                        <span class="tx-badge">${isOut ? 'صادر' : 'وارد'}</span>
                    </div>
                    <button class="tx-delete" title="حذف" data-id="${tx.id}">🗑</button>
                `;
                container.appendChild(card);
            });

            container.querySelectorAll('.tx-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = Number(btn.getAttribute('data-id'));
                    deleteTransaction(id);
                });
            });
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function deleteTransaction(id) {
            if (!confirm('هل تريد حذف هذه العملية؟')) return;
            transactions = transactions.filter(t => t.id !== id);
            saveTransactions();
            renderAll();
        }

        function renderAll() {
            renderBalance();
            renderCounts();
            renderTransactions();
        }

        // =============================================
        // الفلترة
        // =============================================
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.getAttribute('data-filter');
                renderTransactions();
            });
        });

        // =============================================
        // نموذج الإضافة
        // =============================================
        const addModal = document.getElementById('addModal');
        const addBtn = document.getElementById('addBtn');
        const closeAddBtn = document.getElementById('closeAddModal');
        const submitBtn = document.getElementById('submitBtn');
        const formError = document.getElementById('formError');

        function openAddModal() {
            selectedType = 'incoming';
            updateTypeButtons();
            document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('formDesc').value = '';
            document.getElementById('formAmount').value = '';
            formError.textContent = '';
            addModal.classList.add('active');
            setTimeout(() => document.getElementById('formDesc').focus(), 200);
        }

        function closeAddModal() {
            addModal.classList.remove('active');
        }

        function updateTypeButtons() {
            const inBtn = document.getElementById('typeInBtn');
            const outBtn = document.getElementById('typeOutBtn');
            inBtn.classList.remove('active-in', 'active-out');
            outBtn.classList.remove('active-in', 'active-out');
            if (selectedType === 'incoming') {
                inBtn.classList.add('active-in');
            } else {
                outBtn.classList.add('active-out');
            }
        }

        document.getElementById('typeInBtn').addEventListener('click', () => {
            selectedType = 'incoming';
            updateTypeButtons();
        });
        document.getElementById('typeOutBtn').addEventListener('click', () => {
            selectedType = 'outgoing';
            updateTypeButtons();
        });

        addBtn.addEventListener('click', openAddModal);
        closeAddBtn.addEventListener('click', closeAddModal);
        addModal.addEventListener('click', (e) => {
            if (e.target === addModal) closeAddModal();
        });

        submitBtn.addEventListener('click', () => {
            const date = document.getElementById('formDate').value.trim();
            const desc = document.getElementById('formDesc').value.trim();
            const amountRaw = document.getElementById('formAmount').value.trim();

            if (!date) { formError.textContent = '⚠️ برجاء إدخال التاريخ'; return; }
            if (!desc) { formError.textContent = '⚠️ برجاء إدخال الوصف'; return; }
            const amount = Number(amountRaw);
            if (!amountRaw || isNaN(amount) || amount <= 0) {
                formError.textContent = '⚠️ برجاء إدخال مبلغ صحيح أكبر من صفر';
                return;
            }

            const newTx = {
                id: generateId(),
                type: selectedType,
                date: date,
                amount: amount,
                description: desc
            };
            transactions.push(newTx);
            saveTransactions();
            renderAll();
            closeAddModal();
            showToast('✅ تم حفظ العملية بنجاح');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && addModal.classList.contains('active')) {
                closeAddModal();
            }
        });

        // =============================================
        // توست التنبيه
        // =============================================
        let toastTimer = null;
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.toggle('error', isError);
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2600);
        }

        // =============================================
        // التصدير
        // =============================================
        function pad2(n) { return String(n).padStart(2, '0'); }

        function buildFileName() {
            const d = new Date();
            const dateStr = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
            return `${dateStr} _ Box App Data.txt`;
        }

        function buildExportContent() {
            const payload = {
                app: "Box App",
                appAr: "تطبيق الصندوق",
                version: 1,
                exportedAt: new Date().toISOString(),
                storageKey: STORAGE_KEY,
                transactionsCount: transactions.length,
                transactions: transactions
            };
            return JSON.stringify(payload, null, 2);
        }

        function exportData() {
            try {
                const content = buildExportContent();
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const fileName = buildFileName();

                const file = new File([blob], fileName, { type: 'text/plain' });
                const canShareFiles = navigator.canShare && navigator.canShare({ files: [file] });

                if (canShareFiles && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
                    navigator.share({
                        files: [file],
                        title: 'Box App Data',
                        text: 'ملف بيانات تطبيق الصندوق'
                    }).then(() => {
                        showToast('✅ تم تجهيز الملف للمشاركة/الحفظ');
                    }).catch(() => {
                        downloadBlob(blob, fileName);
                    });
                } else {
                    downloadBlob(blob, fileName);
                }

                showToast(`📤 تم تصدير ${transactions.length} عملية`);
            } catch (e) {
                console.error(e);
                showToast('❌ فشل التصدير', true);
            }
        }

        function downloadBlob(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // =============================================
        // الاستيراد
        // =============================================
        function parseImportContent(text) {
            try {
                const data = JSON.parse(text);
                if (data && Array.isArray(data.transactions)) {
                    return data.transactions;
                }
                if (Array.isArray(data)) {
                    return data;
                }
            } catch (e) { /* تجاهل */ }
            throw new Error('صيغة الملف غير مدعومة');
        }

        function normalizeTransaction(t) {
            const type = (t.type === 'outgoing' || t.type === 'صادر' || t.type === 'out') ? 'outgoing' : 'incoming';
            const amount = Number(t.amount);
            return {
                id: Number(t.id) || 0,
                type: type,
                date: String(t.date || '').trim(),
                amount: isNaN(amount) ? 0 : amount,
                description: String(t.description || '').trim()
            };
        }

        function handleImportFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const text = e.target.result;
                    const raw = parseImportContent(text);

                    if (!raw || raw.length === 0) {
                        showToast('⚠️ الملف لا يحتوي على بيانات', true);
                        return;
                    }

                    const count = raw.length;
                    const ok = confirm(
                        `📥 سيتم استيراد ${count} عملية.\n\n` +
                        `⚠️ سيتم استبدال جميع البيانات الحالية.\n\n` +
                        `هل تريد المتابعة؟`
                    );
                    if (!ok) {
                        showToast('تم إلغاء الاستيراد');
                        return;
                    }

                    const imported = raw.map(normalizeTransaction).filter(t => t.description || t.amount);

                    let maxId = 0;
                    imported.forEach(t => { if (t.id > maxId) maxId = t.id; });
                    imported.forEach(t => {
                        if (!t.id || t.id === 0) t.id = ++maxId;
                    });

                    transactions = imported;
                    saveTransactions();
                    renderAll();
                    showToast(`✅ تم استيراد ${imported.length} عملية بنجاح`);
                } catch (err) {
                    console.error(err);
                    showToast('❌ فشل قراءة الملف - تأكد أنه ملف صادر من البرنامج', true);
                }
            };
            reader.onerror = () => showToast('❌ فشل قراءة الملف', true);
            reader.readAsText(file, 'UTF-8');
        }

        // =============================================
        // ربط أزرار التصدير/الاستيراد
        // =============================================
        document.getElementById('exportBtn').addEventListener('click', exportData);

        const importFileInput = document.getElementById('importFileInput');
        document.getElementById('importBtn').addEventListener('click', () => {
            importFileInput.value = '';
            importFileInput.click();
        });
        importFileInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (file) handleImportFile(file);
        });

        // =============================================
        // الإقلاع
        // =============================================
        loadTransactions();

        setTimeout(() => {
            const welcome = document.getElementById('welcomeScreen');
            if (welcome && welcome.parentNode) welcome.remove();

            document.getElementById('appContainer').style.display = 'block';
            document.getElementById('addBtn').style.display = 'flex';

            renderAll();
        }, 2800);
    </script>

</body>
</html>
